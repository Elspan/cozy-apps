{{- $gateway := (.Values._namespace | default dict).gateway | default "" }}
{{- if $gateway }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
spec:
  # No sectionName: the route attaches to whichever listener on the tenant
  # Gateway matches the hostname (per-app listener with HTTP-01, wildcard
  # listener with DNS-01).
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cozystack
      namespace: {{ $gateway }}
  hostnames:
    - {{ include "vaultwarden.host" . | quote }}
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}
          port: 80
{{- end }}
