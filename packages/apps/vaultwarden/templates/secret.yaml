{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-credentials" .Release.Name) }}
{{- $adminToken := randAlphaNum 48 }}
{{- if and $existingSecret (hasKey $existingSecret.data "admin-token") }}
  {{- $adminToken = index $existingSecret.data "admin-token" | b64dec }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
  labels:
    apps.cozystack.io/user-secret: "true"
stringData:
  url: https://{{ include "vaultwarden.host" . }}
  admin-token: {{ $adminToken | quote }}
  {{- with .Values.smtp.password }}
  smtp-password: {{ . | quote }}
  {{- end }}
